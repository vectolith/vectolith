<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 1000" width="100%" height="100%" fill="none" stroke="#F4F3F1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer Monolithic Prism Silhouette -->
  <polygon points="250,60 380,180 380,820 250,940 120,820 120,180" />
  
  <!-- Central Vertical Axis -->
  <line x1="250" y1="60" x2="250" y2="940" />
  
  <!-- Upper Vector Facets -->
  <polyline points="250,60 190,260 250,420 310,260 250,60" />
  <line x1="120" y1="180" x2="190" y2="260" />
  <line x1="380" y1="180" x2="310" y2="260" />
  
  <!-- Central Diamond & Converging Vectors -->
  <polyline points="120,180 250,520 380,180" />
  <polyline points="120,820 250,480 380,820" />
  
  <!-- Lower Vector Facets & Chevron Base -->
  <polyline points="250,940 190,740 250,580 310,740 250,940" />
  <line x1="120" y1="820" x2="190" y2="740" />
  <line x1="380" y1="820" x2="310" y2="740" />
  
  <!-- Lateral Framing Struts -->
  <line x1="190" y1="260" x2="190" y2="740" />
  <line x1="310" y1="260" x2="310" y2="740" />
</svg>
