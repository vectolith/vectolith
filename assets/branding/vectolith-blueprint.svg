<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc">
<title id="title">VECTOLITH — Geometric Mark / Blueprint Study</title>
<desc id="desc">Technical presentation of the Vectolith geometric emblem. White linework on a cobalt grid. Views and construction notes are illustrative, not manufacturing dimensions.</desc>
<defs>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2455a8" stroke-width="1"/></pattern>
 <pattern id="major" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#3569b7" stroke-width="1.2"/></pattern>
 <style>
 text{font-family:'SFMono-Regular',Menlo,Consolas,monospace;fill:#f4f6ff}
 .line{fill:none;stroke:#f4f6ff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
 .thin{fill:none;stroke:#f4f6ff;stroke-width:1.8}
 .dash{stroke-dasharray:9 8}
 .head{font-size:28px;letter-spacing:1.5px}
 .sub{font-size:18px;letter-spacing:.4px}
 .label{font-size:20px;letter-spacing:.7px}
 .note{font-size:17px}
 </style>
</defs>
<rect width="1200" height="1400" fill="#082e83"/><rect width="1200" height="1400" fill="url(#grid)"/><rect width="1200" height="1400" fill="url(#major)"/>
