<text x="820" y="790" class="label">03 / GEOMETRY GUIDE</text>
<g transform="translate(835 810) scale(.45)" class="thin dash">
 <path d="M420 230L670 350V850L420 970L170 850V350Z"/>
 <path d="M420 230V970M170 350L420 600L670 350M170 850L420 600L670 850M305 420V780M535 420V780M420 230L305 420L420 600L535 420L420 230M420 600L305 780L420 970L535 780L420 600"/>
