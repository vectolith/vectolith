xt x="100" y="1100" class="s">FRONT / AXIAL GUIDE</text><path class="thin" d="M720 170V1145"/><text x="755" y="185" class="h">02 / REDUCED STUDY</text><g transform="translate(780 220) scale(.54)" class="w"><path d="M397 230L650 350V850L397 970L145 850V350Z M397 230V970 M397 230L285 420L397 530L509 420Z M145 350L285 420M650 350L509 420 M145 350L397 600L650 350M145 850L397 600L650 850 M397 970L285 780L397 670L509 780Z M145 850L285 780M650 850L509 780 M285 420V780M509 420V780 M330 540L397 600L330 660L397 600M464 540L397 600L464 660"/></g><text x="780" y="800" class="s">SYMBOL ONLY / REDUCED</text><path class="thin" d="M55 1165H1145"/><text x="55" y="1210" class="h">03 / WORDMARK CONSTRUCTION</text><text x="60" y="1270" class="xs">CAP HEIGHT</text><text x="60" y="1360" class="xs">BASELINE</text><path class="thin dash" d="M175 1260H1120M175 1345H1120M175 1300H1120"/><text x="645" y="1245" class="xs">TRACKING / OPTICAL BALANCE</text><text x="180" y="1335" font-family="'Space Grotesk','Manrope','Avenir Next','Segoe UI',sans-serif" font-size="76" font-weight="600" letter-spacing="10" fill="#f3f6ff">VECTOLITH</text><path class="thin" d="M55 1390H1145"/><text x="55" y="1430" class="s">TYPOGRAPHY: GEOMETRIC SANS / SEMIBOLD / UPPERCASE</text><text x="760" y="1430" class="s">CONSTRUCTION: RELATIVE / ILLUSTRATIVE</text></svg>