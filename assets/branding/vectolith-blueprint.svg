<path class="thin" d="M760 170V1050"/><text x="800" y="195" class="label">02 / REDUCED VIEW</text>
<g transform="translate(820 220) scale(.56)" class="line">
 <path d="M420 230L670 350V850L420 970L170 850V350Z"/><path d="M420 230V970"/>
 <path d="M420 230L305 420L420 530L535 420Z"/><path d="M170 350L305 420M670 350L535 420"/>
 <path d="M170 350L420 600L670 350M170 850L420 600L670 850"/>
 <path d="M420 970L305 780L420 670L535 780Z"/><path d="M170 850L305 780M670 850L535 780"/>
