<text x="820" y="1260" class="note">AXIAL ALIGNMENT / INTERSECTION STUDY</text>
<path class="thin" d="M55 1105H1145"/><text x="65" y="1150" class="label">DESIGN CHARACTERISTICS</text>
<text x="65" y="1190" class="note">• Vertically balanced, axis-led composition</text>
<text x="65" y="1225" class="note">• Angular outer contour and internal diagonals</text>
<text x="65" y="1260" class="note">• Intersecting paths converge through the centre</text>
<text x="65" y="1295" class="note">• Linework shown as a visual construction study</text>
<path class="thin" d="M700 1130V1320"/><text x="740" y="1150" class="label">DRAWING STATUS</text>
<text x="740" y="1190" class="note">ILLUSTRATIVE GEOMETRY</text><text x="740" y="1225" class="note">No physical scale or manufacturing</text>
<text x="740" y="1260" class="note">dimensions are specified here.</text><text x="740" y="1295" class="note">Identity / blueprint edition</text>
